[package]
name = "blip"
version = "0.1.0"
edition = "2021"
description = "A tiny self-hosted uptime monitor with a status page"
license = "MIT"
repository = "https://github.com/instantnodeeu/blip"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
socket2 = "0.5"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# url pulls in ICU for internationalised domain names, which roughly doubles
# the binary. 1.0 of the adapter is the ASCII-only variant.
idna_adapter = "=1.0.0"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
